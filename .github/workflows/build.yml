name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Package plugin zip
        run: |
          PLUGIN_NAME="wake-on-controller"
          mkdir -p "dist-zip/${PLUGIN_NAME}"
          cp -r dist        "dist-zip/${PLUGIN_NAME}/"
          cp    main.py     "dist-zip/${PLUGIN_NAME}/"
          cp    plugin.json "dist-zip/${PLUGIN_NAME}/"
          cd dist-zip
          zip -r "../${PLUGIN_NAME}.zip" "${PLUGIN_NAME}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wake-on-controller.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
